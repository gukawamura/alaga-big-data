services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${ALAGA_AIRFLOW_DB_PASSWORD:?Defina ALAGA_AIRFLOW_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALAGA_AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${ALAGA_AIRFLOW_DB_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./config:/opt/airflow/config:ro
      - ${ALAGA_CHEGADA_DIR:-./chegada}:/opt/airflow/chegada

volumes:
  airflow_home:
  postgres_data:
